<svg xmlns="http://www.w3.org/2000/svg" width="600" height="448" viewBox="0 0 600 448" role="img" aria-labelledby="title desc">
<title id="title">先分清收益欄位，再解讀落袋比例</title><desc id="desc">總 PnL、已實現收益與未實現收益應分開閱讀。落袋比例是已實現收益除以總 PnL，轉成百分比；它不是勝率或提領率。</desc><rect width="600" height="448" rx="20" fill="#122139"/>
<g font-family="Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="36" y="44" fill="#9fbbdf" font-size="13" letter-spacing="2">FIELD NOTES / PNL</text><text x="36" y="88" fill="#fff" font-size="27" font-weight="700">先認欄位，再讀比例。</text>
<g fill="#1e3553"><rect x="36" y="120" width="164" height="88" rx="12"/><rect x="216" y="120" width="164" height="88" rx="12"/><rect x="396" y="120" width="168" height="88" rx="12"/></g><g fill="#fff" font-size="21" font-weight="700" text-anchor="middle"><text x="118" y="158">總 PnL</text><text x="298" y="158">已實現</text><text x="480" y="158">未實現</text></g><g fill="#aac2df" font-size="13" text-anchor="middle"><text x="118" y="185">TOTAL PNL</text><text x="298" y="185">REALIZED</text><text x="480" y="185">UNREALIZED</text></g>
<rect x="36" y="232" width="528" height="116" rx="12" fill="#193c3d"/><text x="60" y="266" fill="#a6d6c7" font-size="14">本站落袋比例</text><text x="60" y="302" fill="#fff" font-size="24" font-weight="700">已實現收益 ÷ 總 PnL → 百分比</text><text x="60" y="329" fill="#b5d5cc" font-size="14">兩個欄位有效，且總 PnL 為正時顯示</text>
<text x="36" y="391" fill="#c6d6ea" font-size="17">這個比例不代表勝率，也不代表已提領資金。</text><text x="36" y="422" fill="#91a8c6" font-size="12">落袋研究室 · 依本站資料說明</text></g></svg>
