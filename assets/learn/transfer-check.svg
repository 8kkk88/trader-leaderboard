<svg xmlns="http://www.w3.org/2000/svg" width="600" height="560" viewBox="0 0 600 560" role="img" aria-labelledby="title desc">
<title id="title">轉出之前，把目的地看完整。</title><desc id="desc">送什麼 · 走哪裡：資產與網路：收款方必須支援相同網路及資產版本；送給誰：完整地址與 Memo／Tag：從可信管道取得，核對最終確認頁；是否能處理：金額、費用與入帳條件：確認最低要求與狀態，首次先小額測試</desc><rect width="600" height="560" rx="20" fill="#122139"/><g font-family="Noto Sans TC,Microsoft JhengHei,sans-serif">
<text x="32" y="39" fill="#9fbbdf" font-size="13" letter-spacing="1.4">TRANSFER / CHECK THE DESTINATION</text>
<text x="32" y="80" fill="white" font-size="27" font-weight="700">轉出之前，把目的地看完整。</text>
<rect x="32" y="108" width="536" height="106" rx="12" fill="#203752"/><text x="54" y="134" fill="#b5cff0" font-size="14">送什麼 · 走哪裡</text><text x="54" y="165" fill="white" font-size="23" font-weight="700">資產與網路</text><text x="54" y="193" fill="#c6d6ea" font-size="17">收款方必須支援相同網路及資產版本</text>
<rect x="32" y="230" width="536" height="106" rx="12" fill="#203752"/><text x="54" y="256" fill="#b5cff0" font-size="14">送給誰</text><text x="54" y="287" fill="white" font-size="23" font-weight="700">完整地址與 Memo／Tag</text><text x="54" y="315" fill="#c6d6ea" font-size="17">從可信管道取得，核對最終確認頁</text>
<rect x="32" y="352" width="536" height="106" rx="12" fill="#1c3b3e"/><text x="54" y="378" fill="#a5d8cc" font-size="14">是否能處理</text><text x="54" y="409" fill="white" font-size="23" font-weight="700">金額、費用與入帳條件</text><text x="54" y="437" fill="#c6d6ea" font-size="17">確認最低要求與狀態，首次先小額測試</text>
<text x="32" y="502" fill="#c6d6ea" font-size="17">相同格式的地址，不代表同一網路一定能入帳。</text><text x="32" y="536" fill="#91a8c6" font-size="12">落袋研究室 · 原創觀念圖解 / @kkweb3345678</text></g></svg>
