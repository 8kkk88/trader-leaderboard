<svg xmlns="http://www.w3.org/2000/svg" width="600" height="560" viewBox="0 0 600 560" role="img" aria-labelledby="title desc">
<title id="title">先決定，想控制哪個條件。</title><desc id="desc">市價單：優先盡快成交：成交價格與數量受市場和平台規則影響；限價單：設定可接受的成交價格：到價也可能未排到、部分成交或無法成交；送出以前：核對交易對、數量與費用：觸發條件不代表一定按預期價格執行</desc><rect width="600" height="560" rx="20" fill="#122139"/><g font-family="Noto Sans TC,Microsoft JhengHei,sans-serif">
<text x="32" y="39" fill="#9fbbdf" font-size="13" letter-spacing="1.4">ORDERS / TWO TRADE-OFFS</text>
<text x="32" y="80" fill="white" font-size="27" font-weight="700">先決定，想控制哪個條件。</text>
<rect x="32" y="108" width="536" height="106" rx="12" fill="#203752"/><text x="54" y="134" fill="#b5cff0" font-size="14">市價單</text><text x="54" y="165" fill="white" font-size="23" font-weight="700">優先盡快成交</text><text x="54" y="193" fill="#c6d6ea" font-size="17">成交價格與數量受市場和平台規則影響</text>
<rect x="32" y="230" width="536" height="106" rx="12" fill="#203752"/><text x="54" y="256" fill="#b5cff0" font-size="14">限價單</text><text x="54" y="287" fill="white" font-size="23" font-weight="700">設定可接受的成交價格</text><text x="54" y="315" fill="#c6d6ea" font-size="17">到價也可能未排到、部分成交或無法成交</text>
<rect x="32" y="352" width="536" height="106" rx="12" fill="#1c3b3e"/><text x="54" y="378" fill="#a5d8cc" font-size="14">送出以前</text><text x="54" y="409" fill="white" font-size="23" font-weight="700">核對交易對、數量與費用</text><text x="54" y="437" fill="#c6d6ea" font-size="17">觸發條件不代表一定按預期價格執行</text>
<text x="32" y="502" fill="#c6d6ea" font-size="17">用模擬情境理解訂單，先弄懂再操作。</text><text x="32" y="536" fill="#91a8c6" font-size="12">落袋研究室 · 原創觀念圖解 / @kkweb3345678</text></g></svg>
