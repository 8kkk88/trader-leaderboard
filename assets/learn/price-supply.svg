<svg xmlns="http://www.w3.org/2000/svg" width="600" height="560" viewBox="0 0 600 560" role="img" aria-labelledby="title desc">
<title id="title">單價，還不是完整的估值。</title><desc id="desc">先看單位：價格 × 流通供應量：得到流通市值的常見估算；再看供應口徑：價格 × 完全稀釋供應量：FDV 使用哪種供應定義，要查資料來源；最後看成交條件：流動性 · 價格影響 · 費用：市值並不是每位持有人都能賣出的金額</desc><rect width="600" height="560" rx="20" fill="#122139"/><g font-family="Noto Sans TC,Microsoft JhengHei,sans-serif">
<text x="32" y="39" fill="#9fbbdf" font-size="13" letter-spacing="1.4">MARKETS / PRICE &amp; SUPPLY</text>
<text x="32" y="80" fill="white" font-size="27" font-weight="700">單價，還不是完整的估值。</text>
<rect x="32" y="108" width="536" height="106" rx="12" fill="#203752"/><text x="54" y="134" fill="#b5cff0" font-size="14">先看單位</text><text x="54" y="165" fill="white" font-size="23" font-weight="700">價格 × 流通供應量</text><text x="54" y="193" fill="#c6d6ea" font-size="17">得到流通市值的常見估算</text>
<rect x="32" y="230" width="536" height="106" rx="12" fill="#203752"/><text x="54" y="256" fill="#b5cff0" font-size="14">再看供應口徑</text><text x="54" y="287" fill="white" font-size="23" font-weight="700">價格 × 完全稀釋供應量</text><text x="54" y="315" fill="#c6d6ea" font-size="17">FDV 使用哪種供應定義，要查資料來源</text>
<rect x="32" y="352" width="536" height="106" rx="12" fill="#1c3b3e"/><text x="54" y="378" fill="#a5d8cc" font-size="14">最後看成交條件</text><text x="54" y="409" fill="white" font-size="23" font-weight="700">流動性 · 價格影響 · 費用</text><text x="54" y="437" fill="#c6d6ea" font-size="17">市值並不是每位持有人都能賣出的金額</text>
<text x="32" y="502" fill="#c6d6ea" font-size="17">低單價不等於便宜，數字必須連同口徑一起看。</text><text x="32" y="536" fill="#91a8c6" font-size="12">落袋研究室 · 原創觀念圖解 / @kkweb3345678</text></g></svg>
