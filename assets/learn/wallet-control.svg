<svg xmlns="http://www.w3.org/2000/svg" width="600" height="448" viewBox="0 0 600 448" role="img" aria-labelledby="title desc">
<title id="title">錢包、金鑰、鏈上帳戶的關係</title><desc id="desc">使用者透過錢包介面操作。金鑰用來簽署，鏈上保存帳戶與資產紀錄；錢包介面不是資產儲存的位置。</desc>
<rect width="600" height="448" rx="20" fill="#122139"/>
<g font-family="Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="36" y="44" fill="#9fbbdf" font-size="13" letter-spacing="2">FIELD NOTES / WALLET</text><text x="36" y="88" fill="#fff" font-size="27" font-weight="700">介面、控制權、紀錄，分開理解。</text>
<rect x="36" y="120" width="528" height="78" rx="12" fill="#1e3553" stroke="#35516f"/><text x="62" y="151" fill="#b5cff0" font-size="14">操作入口</text><text x="62" y="178" fill="#fff" font-size="22" font-weight="700">錢包介面</text><text x="282" y="167" fill="#c6d6ea" font-size="18">查看帳戶 · 準備交易</text>
<path d="M300 200v26m-7-7 7 7 7-7" fill="none" stroke="#82b4f5" stroke-width="2"/>
<rect x="36" y="236" width="250" height="110" rx="12" fill="#233b55"/><rect x="302" y="236" width="262" height="110" rx="12" fill="#193c3d"/>
<text x="60" y="272" fill="#b5cff0" font-size="14">控制權</text><text x="60" y="306" fill="#fff" font-size="22" font-weight="700">金鑰負責簽署</text><text x="326" y="272" fill="#a6d6c7" font-size="14">資料紀錄</text><text x="326" y="306" fill="#fff" font-size="22" font-weight="700">帳戶狀態在鏈上</text>
<text x="36" y="390" fill="#c6d6ea" font-size="17">先確認誰掌握金鑰，再選擇適合的工具。</text><text x="36" y="422" fill="#91a8c6" font-size="12">落袋研究室 · 概念圖 / 以 Ethereum 帳戶模型為例</text></g></svg>
