<svg xmlns="http://www.w3.org/2000/svg" width="600" height="560" viewBox="0 0 600 560" role="img" aria-labelledby="title desc">
<title id="title">部位、保證金、風險要分開。</title><desc id="desc">價格變動影響誰：部位的名義金額：同樣的價格波動，部位越大，金額影響越大；需要投入多少：保證金與槓桿：還要核對維持保證金與強平規則；預計承受多少：計畫風險金額：停損執行、滑價與費用可能讓結果不同</desc><rect width="600" height="560" rx="20" fill="#122139"/><g font-family="Noto Sans TC,Microsoft JhengHei,sans-serif">
<text x="32" y="39" fill="#9fbbdf" font-size="13" letter-spacing="1.4">RISK / BEFORE THE TRADE</text>
<text x="32" y="80" fill="white" font-size="27" font-weight="700">部位、保證金、風險要分開。</text>
<rect x="32" y="108" width="536" height="106" rx="12" fill="#203752"/><text x="54" y="134" fill="#b5cff0" font-size="14">價格變動影響誰</text><text x="54" y="165" fill="white" font-size="23" font-weight="700">部位的名義金額</text><text x="54" y="193" fill="#c6d6ea" font-size="17">同樣的價格波動，部位越大，金額影響越大</text>
<rect x="32" y="230" width="536" height="106" rx="12" fill="#203752"/><text x="54" y="256" fill="#b5cff0" font-size="14">需要投入多少</text><text x="54" y="287" fill="white" font-size="23" font-weight="700">保證金與槓桿</text><text x="54" y="315" fill="#c6d6ea" font-size="17">還要核對維持保證金與強平規則</text>
<rect x="32" y="352" width="536" height="106" rx="12" fill="#1c3b3e"/><text x="54" y="378" fill="#a5d8cc" font-size="14">預計承受多少</text><text x="54" y="409" fill="white" font-size="23" font-weight="700">計畫風險金額</text><text x="54" y="437" fill="#c6d6ea" font-size="17">停損執行、滑價與費用可能讓結果不同</text>
<text x="32" y="502" fill="#c6d6ea" font-size="17">計畫風險不是損失保證上限。</text><text x="32" y="536" fill="#91a8c6" font-size="12">落袋研究室 · 原創觀念圖解 / @kkweb3345678</text></g></svg>
