<svg xmlns="http://www.w3.org/2000/svg" width="600" height="560" viewBox="0 0 600 560" role="img" aria-labelledby="title desc">
<title id="title">三個動作，三種檢查。</title><desc id="desc">連接：讓網站識別帳戶：核對網域；斷開連接不等於撤銷鏈上授權；簽名：用金鑰確認一段內容：不付 Gas 的簽名，也可能產生資產權限；授權或交易：允許操作，或提交狀態變更：檢查合約、資產、額度與實際效果</desc><rect width="600" height="560" rx="20" fill="#122139"/><g font-family="Noto Sans TC,Microsoft JhengHei,sans-serif">
<text x="32" y="39" fill="#9fbbdf" font-size="13" letter-spacing="1.4">SECURITY / READ THE REQUEST</text>
<text x="32" y="80" fill="white" font-size="27" font-weight="700">三個動作，三種檢查。</text>
<rect x="32" y="108" width="536" height="106" rx="12" fill="#203752"/><text x="54" y="134" fill="#b5cff0" font-size="14">連接</text><text x="54" y="165" fill="white" font-size="23" font-weight="700">讓網站識別帳戶</text><text x="54" y="193" fill="#c6d6ea" font-size="17">核對網域；斷開連接不等於撤銷鏈上授權</text>
<rect x="32" y="230" width="536" height="106" rx="12" fill="#203752"/><text x="54" y="256" fill="#b5cff0" font-size="14">簽名</text><text x="54" y="287" fill="white" font-size="23" font-weight="700">用金鑰確認一段內容</text><text x="54" y="315" fill="#c6d6ea" font-size="17">不付 Gas 的簽名，也可能產生資產權限</text>
<rect x="32" y="352" width="536" height="106" rx="12" fill="#1c3b3e"/><text x="54" y="378" fill="#a5d8cc" font-size="14">授權或交易</text><text x="54" y="409" fill="white" font-size="23" font-weight="700">允許操作，或提交狀態變更</text><text x="54" y="437" fill="#c6d6ea" font-size="17">檢查合約、資產、額度與實際效果</text>
<text x="32" y="502" fill="#c6d6ea" font-size="17">看不懂的請求，可以先取消，再查清楚。</text><text x="32" y="536" fill="#91a8c6" font-size="12">落袋研究室 · 原創觀念圖解 / @kkweb3345678</text></g></svg>
