<title id="title">從介面，走到鏈上紀錄。</title><desc id="desc">操作入口：錢包 · 準備並簽署操作：先確認使用的帳戶與網路；互動對象：應用 · 提供功能與規則：閱讀交易、簽名與授權內容；執行與紀錄：網路 · 驗證並記錄狀態：用對應區塊瀏覽器查詢結果</desc><rect width="600" height="560" rx="20" fill="#122139"/><g font-family="Noto Sans TC,Microsoft JhengHei,sans-serif">
