name: Wallet source check
run-name: Wallet source check · ${{ inputs.audit_id || github.event_name }}

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      audit_id:
        description: Optional acceptance-run label (does not change source data)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: wallets-check-main
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install requests only
        run: python -m pip install -r wallets-check/requirements.txt
      - name: Verify checker safeguards
        run: python -m unittest discover -s wallets-check -p 'test_check.py'
      - name: Check official source text
        run: |
          sha256sum wallets.json > "$RUNNER_TEMP/wallets-reviewed.sha256"
          chmod a-w wallets.json
          result=0
          python wallets-check/check.py || result=$?
          sha256sum --check "$RUNNER_TEMP/wallets-reviewed.sha256"
          if [ "$result" -gt 1 ]; then exit "$result"; fi
          python wallets-check/report.py
      - name: Commit only snapshots, review queue and check log
        run: bash wallets-check/publish-status.sh
      # GITHUB_TOKEN pushes do not trigger the branch-based Pages builder.
      - name: Request GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '{status, url}'
      - name: Preserve execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wallets-check-${{ github.run_id }}
          retention-days: 14
          path: |
            wallets-check/check.log
            wallets-check/check-log.json
            wallets-check/review-queue.json
            wallets-check/snapshots/
