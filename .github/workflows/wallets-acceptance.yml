name: Wallet checker acceptance
on:
  # One-time bootstrap. Removed after initial acceptance; future runs are manual.
  push:
    branches: [main]
    paths: ['.github/workflows/wallets-acceptance.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wallets-acceptance-main
  cancel-in-progress: false

jobs:
  acceptance:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      actions: write
      pages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r wallets-check/requirements.txt
      - name: Dispatch baseline, test hash change and verify review queue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python wallets-check/acceptance.py
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wallets-acceptance-${{ github.run_id }}
          retention-days: 30
          path: wallets-check/acceptance-log.json
