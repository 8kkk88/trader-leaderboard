name: Wallet checker acceptance
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wallets-acceptance-main
  cancel-in-progress: false

jobs:
  acceptance:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      actions: write
      pages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r wallets-check/requirements.txt
      - name: Dispatch baseline, test hash change and verify review queue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python wallets-check/acceptance.py
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wallets-acceptance-${{ github.run_id }}
          retention-days: 30
          path: wallets-check/acceptance-log.json
