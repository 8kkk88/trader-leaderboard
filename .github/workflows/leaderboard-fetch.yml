name: Leaderboard fetch validation
run-name: Leaderboard fetch validation (artifact only)

# Deliberately manual-only until Ren confirms the single-writer handoff.
on:
  workflow_dispatch:

# This workflow cannot publish repository changes.
permissions:
  contents: read

concurrency:
  group: leaderboard-data-writer-main
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Synchronize remote before collecting data
        run: |
          git fetch --no-tags origin main
          git merge --ff-only FETCH_HEAD
          git diff --exit-code HEAD -- data.json fetch.py sync.sh
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install collector dependency
        run: python -m pip install -r leaderboard-fetch/requirements.txt
      - name: Test validation and write isolation
        run: python -m unittest discover -s leaderboard-fetch -p 'test_validate.py'
      - name: Read Secret and collect a fresh candidate outside the checkout
        env:
          BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
        run: |
          sha256sum data.json > "$RUNNER_TEMP/leaderboard-before.sha256"
          chmod a-w data.json
          python leaderboard-fetch/validate.py --output-dir "$RUNNER_TEMP/leaderboard-validation"
      - name: Verify the repository data is unchanged
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/leaderboard-before.sha256" ]]; then
            sha256sum --check "$RUNNER_TEMP/leaderboard-before.sha256"
          fi
          git diff --exit-code HEAD -- data.json fetch.py sync.sh
      - name: Upload candidate and validation evidence for Ren
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: leaderboard-validation-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/leaderboard-validation/data.json
            ${{ runner.temp }}/leaderboard-validation/baseline-data.json
            ${{ runner.temp }}/leaderboard-validation/validation.json
            ${{ runner.temp }}/leaderboard-validation/README.md
